<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalog</title>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="logo">
                <p>S&M</p>
                <p>Sandra&Marsik</p>
            </div>
            <nav class="nav">
                <ul class="nav__list">
                    <li>Home</li>
                    <li>Sandra</li>
                    <li>Marsik</li>
                    <li>Favs</li>
                    <li>Help</li>
                    <li>Contacts</li>
                </ul>
            </nav>
        </div>
    </header>
    <section class="catalog-title">
        <div class="container">
            <div class="catalog-title__content">
                <p>Cat catalog</p>
                <h1>Little things for happy cats.</h1>
                <p>Practical, cozy and stylish essentials for Sandra and Marsik - and for your cats too.</p>
            </div>
        </div>
    </section>
    <section class="catalog">
        <div class="container">
            <div class="catalog__content">
                <div class="catalog__buttons">
                    <button class="button" type="button">All</button>
                    <button class="button" type="button">Food & Bowls</button>
                    <button class="button" type="button">Toys</button>
                    <button class="button" type="button">Cozy Home</button>
                    <button class="button" type="button">Grooming</button>
                </div>
                <div class="catalog__cards">
                    <div class="card">
                        <img src="img/catalog/ceramic-cat-bowl.png" alt="cat-bowl">
                        <p>Ceramic Cat Bowl</p>
                        <p>$12</p>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <footer class="footer">
        <div class="container">
            <div class="footer__content">
                <p>© 2026</p>
                <p>A little website about two very loved cats.</p>
                <div class="footer__links"></div>
            </div>
        </div>
    </footer>
</body>
</html>
